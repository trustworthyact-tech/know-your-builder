name: Lighthouse performance budget

# Enforces the marketing site's performance budget (website redesign, 2026-10):
# Lighthouse >= 95 in every category, LCP <= 2.5s, CLS <= 0.1, TBT <= 200ms,
# measured on the mobile preset against a production build. Thresholds live in
# web/lighthouserc.json. Reports are kept as a workflow artifact, never uploaded
# to a public Lighthouse server.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Placeholders so lib/env.ts validation passes for a local `next start`.
      # The pages measured here never touch any of these services.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      REDIS_URL: redis://localhost:6379
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.0 autorun
      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          if-no-files-found: ignore
