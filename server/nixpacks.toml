[phases.setup]
# puppeteer@25 (and its dependencies @puppeteer/browsers, chromium-bidi) require
# Node >=22.12.0 — the version require() gained the ability to load ESM synchronously.
# The nixpkgs revision this nixpacks builder pins resolves nodejs_22 to 22.11.0, one
# patch short, so require('puppeteer') silently fails at the ESM boundary and every
# Puppeteer-based scraper crashes with ERR_REQUIRE_ESM. This pinned nixpkgs snapshot
# tops out at nodejs_23 (23.2.0 — confirmed via its all-packages.nix) — no nodejs_24
# exists at this revision, so that's the newest available and clears the bar.
nixPkgs = [
  "nodejs_23",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "glib",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXcursor",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrandr",
  "xorg.libXrender",
  "xorg.libXtst",
  "xorg.libxcb",
  "libxkbcommon",
  "at-spi2-atk",
  "pango",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "mesa",
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
# puppeteer@25 also downloads a separate chrome-headless-shell binary during `npm ci`,
# which PUPPETEER_SKIP_CHROMIUM_DOWNLOAD does not cover. This build's container lacks
# tar/unzip to extract it, so that download now fails the build outright (confirmed
# 2026-08-28 — a build that changed no dependencies failed here where the prior one
# succeeded, so something about the builder image changed underneath us). Neither
# downloaded binary is ever used anyway — PUPPETEER_EXECUTABLE_PATH below always points
# at the Nix-provided system Chromium. Skip all of Puppeteer's own browser downloads.
PUPPETEER_SKIP_DOWNLOAD = "true"
# /run/current-system/sw/bin/chromium is a NixOS system-profile path that never existed
# in this Docker-based nixpacks build — it was masked until now because ERR_REQUIRE_ESM
# (see nixPkgs comment above) crashed before puppeteer.launch() ever ran. Confirmed via
# `railway ssh` that nix-env -i installs to /root/.nix-profile/bin/ in this container.
PUPPETEER_EXECUTABLE_PATH = "/root/.nix-profile/bin/chromium"
