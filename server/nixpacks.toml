[phases.setup]
# puppeteer@25 (and its dependencies @puppeteer/browsers, chromium-bidi) require
# Node >=22.12.0 — the version require() gained the ability to load ESM synchronously.
# The nixpkgs revision this nixpacks builder pins resolves nodejs_22 to 22.11.0, one
# patch short, so require('puppeteer') silently fails at the ESM boundary and every
# Puppeteer-based scraper crashes with ERR_REQUIRE_ESM. nodejs_24 clears the bar.
nixPkgs = [
  "nodejs_24",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "glib",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXcursor",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrandr",
  "xorg.libXrender",
  "xorg.libXtst",
  "xorg.libxcb",
  "libxkbcommon",
  "at-spi2-atk",
  "pango",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "mesa",
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/run/current-system/sw/bin/chromium"
